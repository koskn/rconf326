<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R-Conference 発表会場検索</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>R-Conference</h1>
        <p class="subtitle">発表会場検索</p>

        <div class="search-box">
            <select id="grade">
                <option value="2">2年</option>
                <option value="1">1年</option>
            </select>
            <select id="class">
                <option value="A">A組</option>
                <option value="B">B組</option>
                <option value="C">C組</option>
                <option value="D">D組</option>
                <option value="E">E組</option>
                <option value="F">F組</option>
                <option value="G">G組</option>
                <option value="H">H組</option>
                <option value="I">I組</option>
                </select>
            <select id="number">
                <option value="1">01</option>
                <option value="2">02</option>
                <option value="3">03</option>
                <option value="4">04</option>
                <option value="5">05</option>
                <option value="6">06</option>
                <option value="7">07</option>
                <option value="8">08</option>
                <option value="9">09</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
                <option value="13">13</option>
                <option value="14">14</option>
                <option value="15">15</option>
                <option value="16">16</option>
                <option value="17">17</option>
                <option value="18">18</option>
                <option value="19">19</option>
                <option value="20">20</option>
                <option value="21">21</option>
                <option value="22">22</option>
                <option value="23">23</option>
                <option value="24">24</option>
                <option value="25">25</option>
                <option value="26">26</option>
                <option value="27">27</option>
                <option value="28">28</option>
                <option value="29">29</option>
                <option value="30">30</option>
                <option value="31">31</option>
                <option value="32">32</option>
                <option value="33">33</option>
                <option value="34">34</option>
                <option value="35">35</option>
                <option value="36">36</option>
                <option value="37">37</option>
                <option value="38">38</option>
                <option value="39">39</option>
                <option value="40">40</option>
                <option value="41">41</option>
                <option value="42">42</option>
                </select>番
            <button onclick="search()">表示</button>
        </div>

        <div id="result" class="hidden">
            <div class="session-card">
                <h2>1・2時間目</h2>
                <div class="info"><span class="label">会場:</span> <span id="v12" class="value"></span></div>
                <div class="info"><span class="label">順番:</span> <span id="o12" class="value"></span></div>
                <div class="info"><span class="label">Spot:</span> <span id="s12" class="value"></span></div>
            </div>

            <div class="session-card">
                <h2>3・4時間目</h2>
                <div class="info"><span class="label">会場:</span> <span id="v34" class="value"></span></div>
                <div class="info"><span class="label">順番:</span> <span id="o34" class="value"></span></div>
                <div class="info"><span class="label">Spot:</span> <span id="s34" class="value"></span></div>
            </div>
        </div>

        <div id="error" class="error hidden">データが見つかりませんでした。</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
