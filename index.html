<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R-Conference 発表会場検索</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>R-Conference</h1>
        <p class="subtitle">発表会場検索</p>

        <div class="search-box">
            <select id="grade">
                <option value="2">2学年</option>
                <option value="1">1学年</option>
            </select>
            <select id="class">
                <option value="A">A組</option>
                <option value="B">B組</option>
                <option value="C">C組</option>
                <option value="D">D組</option>
                </select>
            <input type="number" id="number" placeholder="出席番号 (例: 1)" min="1">
            <button onclick="search()">表示する</button>
        </div>

        <div id="result" class="hidden">
            <div class="session-card">
                <h2>【1・2時間目】</h2>
                <div class="info"><span class="label">会場:</span> <span id="v12" class="value"></span>
                <span id="o12" class="value"></span> <span id="s12" class="value"></span></div>
            </div>

            <div class="session-card">
                <h2>【3・4時間目】</h2>
                <div class="info"><span class="label">会場:</span> <span id="v34" class="value"></span>
                <span id="o34" class="value"></span> <span id="s34" class="value"></span></div>
            </div>
        </div>

        <div id="error" class="error hidden">データが見つかりませんでした。</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
